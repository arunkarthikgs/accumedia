name: Deploy Accumedia email relay

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accumedia-email-relay
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy email relay only
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub secret CLOUDFLARE_API_TOKEN"; exit 1; }
          account_id=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]' | sed 's/^"//; s/"$//; s/^'"'"'//; s/'"'"'$//')
          printf '%s\n' "$account_id" | grep -Eq '^[A-Za-z0-9_-]+$' || { echo "CLOUDFLARE_ACCOUNT_ID must contain only letters, numbers, hyphens, or underscores"; exit 1; }
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"

      - name: Deploy email relay Worker and Container
        run: npx wrangler deploy --config video-render-cloudflare/wrangler.jsonc --containers-rollout=immediate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}